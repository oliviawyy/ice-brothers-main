<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Brothers | Seu Carrinho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <link rel="stylesheet" href="static/css/carrinho.css">
</head>

<body>
    <div class="site-container">

        <header class="header-aura">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid px-4">
                    <img src="static/img/logo-brothers.svg" alt="logo-brothers" class="logo-main">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                            <li class="nav-item"><a class="nav-link" href="/">HOME</a></li>
                            <li class="nav-item"><a class="nav-link" href="#sobre">SOBRE</a></li>
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button"
                                    data-bs-toggle="dropdown">COLEÇÃO</a>
                                <ul class="dropdown-menu shadow-sm">
                                    <li><a class="dropdown-item" href="#">MOLETOM</a></li>
                                    <li><a class="dropdown-item" href="#">CAMISAS</a></li>
                                    <li><a class="dropdown-item" href="#">ACESSORIOS</a></li>
                                    <li><a class="dropdown-item" href="#">TENIS</a></li>
                                </ul>
                            </li>
                        </ul>

                        <form class="d-flex search-aura align-items-center me-3" role="search">
                            <input class="form-control me-2" type="search" placeholder="Buscar..."
                                style="max-height: 35px;">
                            <button class="btn btn-search d-flex align-items-center gap-1" type="submit">
                                <i class="bi bi-search"></i> Pesquisar
                            </button>
                        </form>

                        <div class="gap-3-custom">
                            <div class="dropdown">
                                <a class="nav-link text-dark fs-5" href="#" role="button" data-bs-toggle="dropdown">
                                    <i class="bi bi-person-circle"></i>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                    <li><a class="dropdown-item" href="#">LOGIN</a></li>
                                    <li><a class="dropdown-item" href="/cadastro">CADASTRO</a></li>
                                </ul>
                            </div>
                        </div>
                        <a class="nav-link text-dark fs-5 position-relative" href="/carrinho">
                            <i class="bi bi-bag-heart"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                id="cart-counter" style="font-size: 10px; padding: 3px 6px;">0</span>
                        </a>
                    </div>
                </div>
    </div>
    </nav>
    </header>

    <main class="cart-main">
        <h1 class="cart-title">Seu Carrinho</h1>

        <div class="empty-cart" id="empty-cart-view">
            <i class="bi bi-bag-x"></i>
            <h3>Seu carrinho está vazio</h3>
            <p class="text-muted">Explore nosso site e adicione estilo ao seu visual.</p>
            <a href="/" class="btn-checkout d-inline-block text-decoration-none mt-3" style="max-width: 250px;">VOLTAR À
                LOJA</a>
        </div>

        <div class="cart-wrapper" id="active-cart-view">
                <div class="cart-items-box" id="cart-items-container"></div>

                <div class="cart-summary-box">
                    <h2 class="summary-title">Resumo do Pedido</h2>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">R$ 0,00</span>
                    </div>
</body>

</html>
